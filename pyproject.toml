# Hasta la 2.7.0 este fichero existía solo para configurar las herramientas de
# desarrollo, y declaraba a propósito que Quilate no se instala como paquete: se
# ejecuta desde `quilate.py` y se empaqueta con `build.ps1`.
#
# Eso sigue siendo la forma normal de usarlo. Lo que ha cambiado es que ahora
# **además** es instalable, porque Quilate Studio vive en un repositorio aparte
# y necesita declarar `quilate` como dependencia. Sin metadatos de empaquetado
# la única alternativa era duplicar el código, que es peor.
#
# Esto NO implica publicar en PyPI, y se sigue sin publicar por el motivo que
# explica `update_check.py`: la etiqueta de git ya está atada a `APP_VERSION`
# por el workflow de release, y eso hace de `releases/latest` la respuesta
# exacta a «¿hay algo más nuevo?». Se instala desde la etiqueta:
#
#     pip install "quilate @ git+https://github.com/CrIsTiAnPvP/Quilate-Benchmark@v2.8.0"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quilate"
description = "Benchmark y auditoría de optimización para Windows, con soporte parcial en Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cristian Alonso" }]
dependencies = ["psutil>=5.9"]
dynamic = ["version"]

[project.urls]
Homepage = "https://cristianac.es"
Repository = "https://github.com/CrIsTiAnPvP/Quilate-Benchmark"

# La versión sale de `const.py` y no se repite aquí. Repetirla sería crear una
# segunda fuente de verdad para el número que el workflow de release ya valida
# contra la etiqueta: dos sitios que decir la versión es un sitio de más donde
# se puede quedar vieja.
#
# Apunta a `const.py` y no a `quilate.APP_VERSION`, que sería lo natural: en
# `__init__.py` la versión es un `from .const import ...`, y eso setuptools no
# lo sabe leer sin importar el paquete. Importarlo durante la construcción
# arrastra `psutil`, que en el entorno aislado de compilación no está. En
# `const.py` es una asignación literal y se lee del código sin ejecutarlo.
[tool.setuptools.dynamic]
version = { attr = "quilate.const.APP_VERSION" }

# Se listan a mano en vez de usar autodetección. Son tres y no cambian a menudo,
# y así un paquete nuevo sin declarar falla al empaquetar en lugar de colarse.
[tool.setuptools]
packages = ["quilate", "quilate.audit", "quilate.export"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `python_files` y `python_functions` se quedan en su valor por defecto
# (`test_*.py` y `test_*`), que es justo la convención que ya sigue el
# directorio: comprobado, la suite entera se recoge sin tocarlos.
#
# `python_classes` también se queda en el defecto (`Test*`), y conviene saber
# lo que eso implica aquí: ninguna clase de esta suite empieza por `Test` —van
# con nombre descriptivo en español (`CapturaDeWindows11`, `SinDatos`)— así que
# pytest las recoge *solo* porque heredan de `unittest.TestCase`. Quitarle esa
# herencia a una clase sin más haría que sus tests dejaran de ejecutarse sin un
# fallo ni un aviso. Por eso los tests migrados a estilo pytest puro son
# funciones a nivel de módulo, que sí encajan con `python_functions`, y las
# clases que se conservan siguen siendo `TestCase`.
#
# Poner `python_classes = "*"` sería la otra salida, pero se probó y no vale:
# pytest empieza a intentar recoger las clases de producción importadas en cada
# módulo de test (`Auditor`, `SystemInfo`, `SinDato`) y llena el informe de
# `PytestCollectionWarning`.

# Un marcador mal escrito (`@pytest.mark.skipif_sin_opencl`) sería un aviso que
# nadie lee y un test que se ejecuta cuando no debía, o al revés. Con esto es
# un error.
addopts = "--strict-markers"
