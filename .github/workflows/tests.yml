name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Los tests no tocan el registro ni WMI —todo va por fixtures— así que la
    # mayoría se ejecutan igual en Linux, que arranca mucho más rápido. La
    # excepción son los que miran el aviso de UAC y la tubería con nombre: eso
    # es de Windows y fuera de él se omite, con `FueraDeWindows` afirmando a
    # cambio que el atajo hace lo correcto. Lo cubre de verdad el job de abajo.
    #
    # La matriz empieza en 3.9 porque es la mínima que prometen el README y
    # `quilate.py`. Hasta ahora empezaba en 3.10, así que la versión mínima era
    # la única que nadie ejecutaba: la promesa la sostenía solo
    # `test_python39.py`, que parsea con la gramática de 3.9 pero no ejecuta
    # nada, y por tanto no caza un `zip(strict=True)` ni un método del stdlib
    # que en 3.9 no exista. Este job sí. Ver `VERSION_MINIMA` en ese fichero.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  # El paquete tiene que seguir importándose en Windows, que es su plataforma
  # real: los tests no cubren las rutas que dependen de winreg de verdad.
  importar-en-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar que importa y compila
        run: |
          python -m compileall -q quilate
          python -c "import quilate.audit, quilate.benchmark, quilate.rawio, quilate.sensors, quilate.sysinfo"

      - name: Tests
        run: python -m unittest discover -s tests -t .
