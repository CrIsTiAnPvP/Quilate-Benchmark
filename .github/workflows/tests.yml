name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Los tests no tocan el registro ni WMI —todo va por fixtures— así que se
    # ejecutan igual en Linux, que arranca mucho más rápido. La matriz de
    # versiones cubre desde la mínima que soporta el proyecto.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  # El paquete tiene que seguir importándose en Windows, que es su plataforma
  # real: los tests no cubren las rutas que dependen de winreg de verdad.
  importar-en-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar que importa y compila
        run: |
          python -m compileall -q quilate
          python -c "import quilate.audit, quilate.benchmark, quilate.rawio, quilate.sensors, quilate.sysinfo"

      - name: Tests
        run: python -m unittest discover -s tests -t .
