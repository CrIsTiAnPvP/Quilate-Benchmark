<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Quilate">
  <title>Quilate</title>
  <defs>
    <linearGradient id="ql-oro" x1="20" y1="10" x2="84" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffeeb0"/>
      <stop offset=".34" stop-color="#f8d156"/>
      <stop offset=".70" stop-color="#e9ab1e"/>
      <stop offset="1" stop-color="#b87c0b"/>
    </linearGradient>
    <!-- La cola no toca el anillo en el icono original: este hueco reproduce esa
         separación recortando el trazo justo por donde pasa la diagonal. -->
    <mask id="ql-muesca">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="56.5" y="46" width="21" height="52" fill="#000"
            transform="rotate(-45 67 72)"/>
    </mask>
  </defs>
  <circle cx="48" cy="46" r="30" fill="none" stroke="url(#ql-oro)" stroke-width="14"
          mask="url(#ql-muesca)"/>
  <rect x="60.5" y="50.8" width="13" height="42.4" rx="1"
        fill="url(#ql-oro)" transform="rotate(-45 67 72)"/>
</svg>
